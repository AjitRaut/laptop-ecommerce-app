<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/laptopWorld_Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LaptopWorld — premium laptops and accessories from Satara, Maharashtra, delivered across India." />
    <title>Laptop World</title>
    <!-- Storefront fonts: connect early and preload the stylesheet; the storefront
         shell applies it (admin/vendor screens never do). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <script>
      // Paint the storefront background before React loads to avoid a white flash.
      // Never touches admin/vendor routes; ThemeProvider takes over on mount.
      (function () {
        try {
          if (/^\/(admin|vendor)(\/|$)/.test(location.pathname)) return;
          var classes = document.documentElement.classList;
          classes.add('sf-boot');
          if (localStorage.getItem('lw-theme') !== 'light') classes.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
